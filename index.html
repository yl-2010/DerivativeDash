<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Derivative Dash Answer Key</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --bg: #f7fbf7;
      --text: #193126;
      --muted: #5b6f66;
      --panel: #ffffff;
      --regular: #2f9e44;
      --regular-dark: #1f7a33;
      --challenge: #d94841;
      --challenge-dark: #ad312c;
      --shadow: 0 18px 45px rgba(19, 49, 36, 0.14);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(47, 158, 68, 0.12), transparent 36rem),
        radial-gradient(circle at bottom right, rgba(217, 72, 65, 0.10), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(47, 158, 68, 0.16);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 46px);
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 5.1rem);
      letter-spacing: -0.07em;
      line-height: 0.95;
    }

    .subtitle {
      max-width: 760px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(25, 49, 38, 0.12);
      color: var(--muted);
      padding: 9px 14px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.regular {
      background: var(--regular);
    }

    .dot.challenge {
      background: var(--challenge);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .card {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      display: block;
      width: 100%;
      min-height: 285px;
      cursor: pointer;
      perspective: 1200px;
      text-align: left;
      color: inherit;
      font: inherit;
    }

    .card:focus-visible {
      outline: 4px solid rgba(47, 158, 68, 0.34);
      outline-offset: 5px;
      border-radius: var(--radius);
    }

    .card-inner {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 285px;
      transition: transform 0.58s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 13px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: auto;
      min-height: 285px;
      width: 100%;
    }

    .front {
      color: #fff;
      padding: 20px;
    }

    .regular-card .front {
      background: linear-gradient(145deg, var(--regular), var(--regular-dark));
    }

    .challenge-card .front {
      background: linear-gradient(145deg, var(--challenge), var(--challenge-dark));
    }

    .back {
      background: var(--panel);
      border: 2px solid rgba(25, 49, 38, 0.08);
      padding: 20px;
      transform: rotateY(180deg);
    }

    .unit {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 900;
      opacity: 0.88;
    }

    .card-title {
      font-size: 1.3rem;
      line-height: 1.15;
      font-weight: 900;
      margin: 0;
    }

    .problem {
      display: block;
      font-size: 1rem;
      margin: auto 0 0;
      overflow-wrap: anywhere;
    }

    .front .problem {
      color: rgba(255, 255, 255, 0.94);
    }

    .back-label {
      margin: 0;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 900;
    }

    .back .problem {
      margin: 0;
      color: var(--text);
      border-bottom: 1px solid rgba(25, 49, 38, 0.1);
      padding-bottom: 14px;
    }

    .answer {
      display: block;
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .hint {
      margin-top: auto;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.84rem;
      font-weight: 700;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      header {
        border-radius: 22px;
        padding: 24px 18px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .card,
      .card-inner,
      .face {
        min-height: 265px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Derivative Dash</h1>
      <p class="subtitle">Answer key for all 49 game cards. Tap or press Enter on a card to flip it and reveal the cleaned-up problem with its final answer.</p>
      <div class="legend" aria-label="Card color legend">
        <span class="pill"><span class="dot regular"></span>Green = regular problem</span>
        <span class="pill"><span class="dot challenge"></span>Red = challenge problem</span>
      </div>
    </header>

    <section class="grid" id="cardGrid" aria-label="Derivative Dash answer cards"></section>

    <footer>Built for GitHub Pages as a static answer key.</footer>
  </main>

  <script>
    const cards = [
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Regular',

      },
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Regular',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=x^2+5x-2\).`,
        answer: String.raw`\(f'(x)=2x+5\)`
      },
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Regular',
        number: '#3',
        problem: String.raw`Differentiate \(f(x)=5x^4+8x^2-4x+9\).`,
        answer: String.raw`\(f'(x)=20x^3+16x-4\)`
      },
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Regular',
        number: '#4',
        problem: String.raw`Differentiate \(f(x)=7x^2+11x^5\).`,
        answer: String.raw`\(f'(x)=14x+55x^4\)`
      },
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Regular',
        number: '#5',
        problem: String.raw`Differentiate \(f(x)=x(x^2-4)\).`,

      },
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=6x^{-2}\).`,
        answer: String.raw`\(f'(x)=-12x^{-3}\)`
      },
      {
        unit: 'Unit 1',
        topic: 'Power Rule',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=7\sqrt{x}\).`,
        answer: String.raw`\(f'(x)=\dfrac{7}{2\sqrt{x}}\)`
      },
      {
        unit: 'Unit 2',
        topic: 'Product & Quotient Rule',
        type: 'Regular',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=(x^2+3)(x^4-1)\).`,

      },
      {
        unit: 'Unit 2',

        type: 'Regular',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=(x^6+7)(3x^2-7x)\).`,
        answer: String.raw`\(f'(x)=24x^7-49x^6+42x-49\)`
      },
      {
        unit: 'Unit 2',
        topic: 'Product & Quotient Rule',
        type: 'Regular',
        number: '#3',
        problem: String.raw`Differentiate \(f(x)=(x^2-6x)(2x^3+9)\).`,
        answer: String.raw`\(f'(x)=10x^4-48x^3+18x-54\)`
      },
      {
        unit: 'Unit 2',
        topic: 'Product & Quotient Rule',
        type: 'Regular',
        number: '#4',
        problem: String.raw`Differentiate \(f(x)=\dfrac{x^2+1}{x-3}\).`,
        answer: String.raw`\(f'(x)=\dfrac{x^2-6x-1}{(x-3)^2}\)`
      },
      {
        unit: 'Unit 2',
        topic: 'Product & Quotient Rule',
        type: 'Regular',
        number: '#5',
        problem: String.raw`Differentiate \(f(x)=\dfrac{x^5-3x^2+4}{x^2+2}\).`,
        answer: String.raw`\(f'(x)=\dfrac{3x^6+10x^4-20x}{(x^2+2)^2}\)`
      },
      {
        unit: 'Unit 2',
        topic: 'Product & Quotient Rule',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=(2x-5)(x^3+4)(3x^2-2x)\).`,
        answer: String.raw`\(f'(x)=36x^5-95x^4+40x^3+72x^2-152x+40\)`
      },
      {
        unit: 'Unit 2',
        topic: 'Product & Quotient Rule',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=\dfrac{x}{x+\frac{1}{x}}\).`,
        answer: String.raw`\(f'(x)=\dfrac{2x}{(x^2+1)^2}\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Regular',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=2\cos(x)\).`,
        answer: String.raw`\(f'(x)=-2\sin(x)\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Regular',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=2\tan(x)+9\sec(x)\).`,
        answer: String.raw`\(f'(x)=2\sec^2(x)+9\sec(x)\tan(x)\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Regular',
        number: '#3',
        problem: String.raw`Differentiate \(f(x)=\csc(x)+9\).`,
        answer: String.raw`\(f'(x)=-\csc(x)\cot(x)\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Regular',
        number: '#4',
        problem: String.raw`Differentiate \(f(x)=9e^x\).`,
        answer: String.raw`\(f'(x)=9e^x\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Regular',
        number: '#5',
        problem: String.raw`Differentiate \(f(x)=\dfrac{e^x}{2}\).`,
        answer: String.raw`\(f'(x)=\dfrac{e^x}{2}\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=\sec^2(x)\).`,
        answer: String.raw`\(f'(x)=2\sec^2(x)\tan(x)\)`
      },
      {
        unit: 'Unit 3',
        topic: 'Trig Functions & e^x',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=\dfrac{\sin(x)}{x}\).`,
        answer: String.raw`\(f'(x)=\dfrac{x\cos(x)-\sin(x)}{x^2}\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Regular',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=(x+1)^3\).`,
        answer: String.raw`\(f'(x)=3(x+1)^2\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Regular',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=(x^4-3)^2\).`,
        answer: String.raw`\(f'(x)=8x^3(x^4-3)\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Regular',
        number: '#3',
        problem: String.raw`Differentiate \(f(x)=\sin(5x)\).`,
        answer: String.raw`\(f'(x)=5\cos(5x)\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Regular',
        number: '#4',
        problem: String.raw`Differentiate \(f(x)=\left(\dfrac{3x}{x^2}\right)^3\).`,
        answer: String.raw`\(f'(x)=-\dfrac{81}{x^4}\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Regular',
        number: '#5',
        problem: String.raw`Differentiate \(f(x)=\sqrt{2x+7}\).`,
        answer: String.raw`\(f'(x)=\dfrac{1}{\sqrt{2x+7}}\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`Differentiate \(f(x)=\sin\!\left(\sqrt{3x^3+9}\right)\).`,
        answer: String.raw`\(f'(x)=\dfrac{9x^2\cos\!\left(\sqrt{3x^3+9}\right)}{2\sqrt{3x^3+9}}\)`
      },
      {
        unit: 'Unit 4',
        topic: 'Chain Rule',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`Differentiate \(f(x)=e^{\sin(2x^5)}\).`,
        answer: String.raw`\(f'(x)=10x^4e^{\sin(2x^5)}\cos(2x^5)\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Regular',
        number: '#1',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) for \(x^3+y^2=6\).`,
        answer: String.raw`\(\dfrac{dy}{dx}=-\dfrac{3x^2}{2y}\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Regular',
        number: '#2',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) for \(x^2+xy+y^2=7\).`,
        answer: String.raw`\(\dfrac{dy}{dx}=-\dfrac{2x+y}{x+2y}\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Regular',
        number: '#3',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) for \(6x^2+7\sin(y)=1\).`,
        answer: String.raw`\(\dfrac{dy}{dx}=-\dfrac{12x}{7\cos(y)}\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Regular',
        number: '#4',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) for \(e^x+y^2=10\).`,
        answer: String.raw`\(\dfrac{dy}{dx}=-\dfrac{e^x}{2y}\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Regular',
        number: '#5',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) for \(x^2y+y=3\).`,
        answer: String.raw`\(\dfrac{dy}{dx}=-\dfrac{2xy}{x^2+1}\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) in terms of only \(x\) for \(x^2+y^2=9\).`,
        answer: String.raw`Upper branch: \(-\dfrac{x}{\sqrt{9-x^2}}\); lower branch: \(\dfrac{x}{\sqrt{9-x^2}}\)`
      },
      {
        unit: 'Unit 5',
        topic: 'Implicit Differentiation',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`Find \(\dfrac{dy}{dx}\) in terms of only \(x\) for \(x^2+2xy+y^2=7\).`,
        answer: String.raw`\(\dfrac{dy}{dx}=-1\)`
      },
      {
        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Regular',
        number: '#1',
        problem: String.raw`A runner's position is \(s(t)=4t^2-16t+20\) feet after \(t\) seconds. Determine when the runner stops moving.`,
        answer: String.raw`\(t=2\) seconds`
      },
      {
        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Regular',
        number: '#2',
        problem: String.raw`A ball is thrown upward with height \(h(t)=-16t^2+48t+5\) feet. Find the velocity when the ball hits the ground.`,
        answer: String.raw`\(-8\sqrt{41}\) ft/s`
      },
      {
        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Regular',
        number: '#3',
        problem: String.raw`A drone moves along a line with position \(s(t)=2t^4-8t^3+3\). Find the intervals where the drone is speeding up.`,

        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Regular',
        number: '#4',
        problem: String.raw`A train's position is \(s(t)=100t-5t^2\) meters. Find its acceleration and determine when it is moving forward.`,
        answer: String.raw`\(a(t)=-10\text{ m/s}^2;\ 0\le t<10\)`
      },
      {
        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Regular',
        number: '#5',
        problem: String.raw`The height of a rocket is \(h(t)=t^3-12t^2+36t\) meters. Find its velocity at the time of its local maximum height.`,

      },
      {
        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`A particle's position is \(s(t)=t^4-6t^3+9t^2\) miles, where \(t\) is in hours. Find its velocity and acceleration at \(t=2\).`,

      },
      {
        unit: 'Unit 6',
        topic: 'Velocity & Acceleration',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`A plane's altitude is \(h(t)=5000+300t^2-10t^3\) feet. Find the acceleration and interpret its meaning.`,

      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Regular',
        number: '#1',
        problem: String.raw`Find the relative extrema of \(f(x)=x^3-3x^2+2\).`,
        answer: String.raw`Relative max: \((0,2)\); relative min: \((2,-2)\)`
      },
      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Regular',
        number: '#2',
        problem: String.raw`Find the relative extrema of \(f(x)=x^4-4x^2\).`,
        answer: String.raw`Relative max: \((0,0)\); relative mins: \((-\sqrt{2},-4)\), \((\sqrt{2},-4)\)`
      },
      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Regular',
        number: '#3',
        problem: String.raw`Find the relative extrema of \(f(x)=2x^3+3x^2-12x\).`,
        answer: String.raw`Relative max: \((-2,20)\); relative min: \((1,-7)\)`
      },
      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Regular',
        number: '#4',
        problem: String.raw`Find the relative extrema of \(f(x)=x^3-6x^2+9x+1\).`,
        answer: String.raw`Relative max: \((1,5)\); relative min: \((3,1)\)`
      },
      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Regular',
        number: '#5',
        problem: String.raw`Find the relative extrema of \(f(x)=x^4-8x^3+18x^2\).`,
        answer: String.raw`Relative min: \((0,0)\); no relative max`
      },
      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Challenge',
        number: '#1',
        problem: String.raw`Find the relative extrema of \(f(x)=x\).`,
        answer: String.raw`No relative extrema`
      },
      {
        unit: 'Unit 7',
        topic: 'Relative Min & Max',
        type: 'Challenge',
        number: '#2',
        problem: String.raw`Find the relative extrema of \(f(x)=6\).`,
        answer: String.raw`Every point is both a relative maximum and a relative minimum`
      }
    ];

    const grid = document.querySelector('#cardGrid');

    function cardTemplate(card, index) {
      const kind = card.type.toLowerCase();
      const label = `${card.unit} ${card.topic} ${card.type} ${card.number}`;

      return `
        <button class="card ${kind}-card" type="button" aria-label="${label}. Flip for answer." aria-pressed="false">
          <span class="card-inner">
            <span class="face front">
              <span class="unit">${card.unit} &bull; ${card.topic}</span>
              <span class="card-title">${card.type === 'Challenge' ? 'Challenge ' : 'Problem '}${card.number}</span>
              <span class="problem">${card.problem}</span>
              <span class="hint">Tap to reveal answer</span>
            </span>
            <span class="face back">
              <span class="back-label">${card.unit} &bull; ${card.type} ${card.number}</span>
              <span class="problem">${card.problem}</span>
              <span class="back-label">Answer</span>
              <span class="answer">${card.answer}</span>
            </span>
          </span>
        </button>
      `;
    }

    grid.innerHTML = cards.map(cardTemplate).join('');

    grid.addEventListener('click', (event) => {
      const card = event.target.closest('.card');
      if (!card) return;
      const isFlipped = card.classList.toggle('flipped');
      card.setAttribute('aria-pressed', String(isFlipped));
    });
  </script>
</body>
</html>
